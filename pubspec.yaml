name: paledu
description: "PalEdu - Interactive Palestinian curriculum learning."
publish_to: none
version: 0.17.0+18
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.3.0
  crypto: ^3.0.6
  supabase_flutter: ^2.15.4
  file_picker: 10.3.10
  url_launcher: ^6.3.1
  html: ^0.15.6
  pdfrx: ^2.6.5
  video_player: ^2.10.0
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/sample_lessons.json
    - assets/animations/
    - assets/brand/paledu_symbol.svg
